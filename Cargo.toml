[package]
name = "live_caption_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["image"] }
whisper-rs = { version = "0.16.0", features = ["vulkan"] }
dirs = "7.0.0"
serde_json = "1.0.149"
serde = "1.0.228"
rosc = "0.11.4"
time = "0.3.47"
egui-file-dialog = "0.16.0"
nnnoiseless = "0.5.2"
resampler = "0.5.1"
pipewire = "0.10.1"
libspa = "0.10.1"
spa_sys = { package = "libspa-sys", version = "0.10.1" }
log = "0.4.35"
env_logger = "0.11.11"

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
criterion = "0.8.2"

[[bench]]
name = "sum_squares"
harness = false
